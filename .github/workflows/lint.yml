name: lint
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Retain the existing job ID for review continuity. Run full-source staticcheck
  # rather than the legacy floating golangci action's only-new-issues mode.
  golangci:
    name: format, vet and staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: ${{ env.DECKYSTREAM_LOCAL_PROFILE != 'constrained' }}
      - name: Install pinned staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: staticcheck ./...
      - name: Release only opted-in private compiler caches after Go consumers
        if: env.DECKYSTREAM_LOCAL_PROFILE == 'constrained'
        run: python3 scripts/local-ci-resources.py trim-compiler-cache
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Review dependency changes against GitHub's advisory database
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
