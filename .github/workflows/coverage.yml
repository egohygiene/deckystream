name: coverage
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: ${{ env.OBSGOD_LOCAL_PROFILE != 'constrained' }}
      - name: Race and coverage
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          go test -race -covermode atomic -coverprofile=profile.cov ./...
          go tool cover -func=profile.cov | tee coverage-summary.txt
      - name: Release only opted-in private compiler caches after Go consumers
        if: env.OBSGOD_LOCAL_PROFILE == 'constrained'
        run: python3 scripts/local-ci-resources.py trim-compiler-cache
      - name: Retain coverage baseline for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ github.sha }}
          path: |
            profile.cov
            coverage-summary.txt
          if-no-files-found: error
          retention-days: 14
