name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: ${{ env.OBSGOD_LOCAL_PROFILE != 'constrained' }}
      - run: go mod download
      - run: go build -trimpath -v ./...
      - run: go test ./...
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Release only opted-in private compiler caches after Go consumers
        if: env.OBSGOD_LOCAL_PROFILE == 'constrained'
        run: python3 scripts/local-ci-resources.py trim-compiler-cache
